      github.com/ACTRIS-Data-Centre/actris-jupyter-hub flake8:
        commands:
        - /usr/bin/env sh .sqa/script.raven_attentive_dingo.sh
        container: qc.sty_dusk_carefree_raven
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.tangerine_cheerful_axolotl.sh
