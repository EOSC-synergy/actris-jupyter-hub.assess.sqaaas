      github.com/ACTRIS-Data-Centre/actris-jupyter-hub get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.flint_smart_seahorse.sh
        container: qc.ver_teal_whimsical_bullfrog
timeout: 5400
