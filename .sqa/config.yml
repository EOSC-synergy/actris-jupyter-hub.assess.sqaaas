      github.com/ACTRIS-Data-Centre/actris-jupyter-hub get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.coral_innocent_penguin.sh
        container: qc.ver_lemon_bewildered_lionfish
timeout: 5400
