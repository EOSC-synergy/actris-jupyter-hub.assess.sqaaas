      github.com/ACTRIS-Data-Centre/actris-jupyter-hub flake8:
        commands:
        - /usr/bin/env sh .sqa/script.turmeric_ardent_albatross.sh
        container: qc.sty_cerulean_fair_raccoon
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.glacier_agile_coyote.sh
        container: qc.sty_puce_imaginative_stingray
