config:
  credentials: []
  project_repos:
    github.com/ACTRIS-Data-Centre/actris-jupyter-hub:
      branch: main
      repo: https://github.com/ACTRIS-Data-Centre/actris-jupyter-hub
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: feature/pynblint_fix
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub git:
        commands:
        - /usr/bin/env sh .sqa/script.sunny-olivine-kudu.sh
        container: qc.acc_wiggy-zucchini-peccary
  QC.Doc:
    repos:
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.lanky-silver-donkey.sh
        container: qc.doc_sleepy-smalt-chipmunk
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub git:
        commands:
        - /usr/bin/env sh .sqa/script.tacky-brown-beetle.sh
        container: qc.doc_randy-grey-catfish
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.tasty-sapphire-grouse.sh
        container: qc.doc_sloppy-eggplant-monkey
  QC.Lic:
    repos:
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub licensee:
        commands:
        - /usr/bin/env sh .sqa/script.beady-rose-squirt.sh
        container: qc.lic_muzzy-bistre-saola
  QC.Sec:
    repos:
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub bandit:
        commands:
        - /usr/bin/env sh .sqa/script.skinny-chartreuse-camel.sh
        container: qc.sec_squirrely-apricot-woodpecker
  QC.Sty:
    repos:
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub flake8:
        commands:
        - /usr/bin/env sh .sqa/script.baggy-carmine-bison.sh
        container: qc.sty_scummy-champagne-bombay
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.chummy-teal-llama.sh
        container: qc.sty_homely-teal-bloodhound
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub pynblint.py:
        commands:
        - /usr/bin/env sh .sqa/script.cheeky-dandelion-turkey.sh
        container: qc.sty_goopy-sepia-avocet
  QC.Uni:
    repos:
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub pytest:
        commands:
        - /usr/bin/env sh .sqa/script.sickly-puce-woodlouse.sh
        container: qc.uni_geeky-platinum-mouse
  QC.Ver:
    repos:
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.dorky-indigo-uakari.sh
        container: qc.ver_flimsy-pear-lemur
timeout: 5400
