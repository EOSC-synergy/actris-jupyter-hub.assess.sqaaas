config:
  credentials: []
  project_repos:
    github.com/ACTRIS-Data-Centre/actris-jupyter-hub:
      branch: main
      repo: https://github.com/ACTRIS-Data-Centre/actris-jupyter-hub
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: feature/pynblint_fix
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub git:
        commands:
        - /usr/bin/env sh .sqa/script.slimy-amethyst-affenpinscher.sh
        container: qc.acc_lovely-vermilion-buzzard
  QC.Doc:
    repos:
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.whiny-cream-abyssinian.sh
        container: qc.doc_shabby-olivine-elephant
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub git:
        commands:
        - /usr/bin/env sh .sqa/script.pretty-goldenrod-ant.sh
        container: qc.doc_dorky-magnolia-barracuda
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.seedy-amaranth-okapi.sh
        container: qc.doc_slaphappy-jade-mongrel
  QC.Lic:
    repos:
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub licensee:
        commands:
        - /usr/bin/env sh .sqa/script.lumpy-pumpkin-balinese.sh
        container: qc.lic_breezy-ultramarine-coyote
  QC.Sec:
    repos:
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub bandit:
        commands:
        - /usr/bin/env sh .sqa/script.randy-linen-snake.sh
        container: qc.sec_lousy-ochre-woodpecker
  QC.Sty:
    repos:
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub flake8:
        commands:
        - /usr/bin/env sh .sqa/script.gloppy-sapphire-tarsier.sh
        container: qc.sty_pretty-turquoise-chimpanzee
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.shaky-tangerine-moth.sh
        container: qc.sty_sloppy-tangerine-lynx
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub pynblint.py:
        commands:
        - /usr/bin/env sh .sqa/script.skanky-jade-capybara.sh
        container: qc.sty_pasty-cerulean-bear
  QC.Uni:
    repos:
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub pytest:
        commands:
        - /usr/bin/env sh .sqa/script.nerdy-pear-spaniel.sh
        container: qc.uni_thirsty-salmon-buzzard
  QC.Ver:
    repos:
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.gummy-denim-discus.sh
        container: qc.ver_snazzy-plum-hornet
timeout: 5400
