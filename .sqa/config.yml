      github.com/ACTRIS-Data-Centre/actris-jupyter-hub bandit:
        commands:
        - /usr/bin/env sh .sqa/script.grape_gracious_raccoon.sh
        container: qc.sec_gray_candid_wasp
  QC.Sty:
