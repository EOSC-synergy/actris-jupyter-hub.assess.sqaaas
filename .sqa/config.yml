      github.com/ACTRIS-Data-Centre/actris-jupyter-hub get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.emerald_goofy_manta.sh
        container: qc.ver_clove_courageous_spren
timeout: 5400
