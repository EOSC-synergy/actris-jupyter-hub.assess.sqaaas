        - /usr/bin/env sh .sqa/script.sage_foolish_cassowary.sh
        container: qc.acc_watermelon_serene_tortoise
  QC.Doc:
    repos:
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.flax_tactful_koala.sh
