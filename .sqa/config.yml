      github.com/ACTRIS-Data-Centre/actris-jupyter-hub bandit:
        commands:
        - /usr/bin/env sh .sqa/script.indigo_plucky_antelope.sh
        container: qc.sec_kiwi_grumpy_albatross
  QC.Sty:
    repos:
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub flake8:
        commands:
        - /usr/bin/env sh .sqa/script.tide_responsible_skunk.sh
        container: qc.sty_crimson_amused_panda
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.fuchsia_positive_shark.sh
        container: qc.sty_mulberry_fierce_lobster
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub pynblint.py:
        commands:
        - /usr/bin/env sh .sqa/script.lapis_ardent_komodo.sh
        container: qc.sty_amaranth_skeptical_hawk
