config:
  credentials: []
  project_repos:
    github.com/ACTRIS-Data-Centre/actris-jupyter-hub:
      branch: main
      repo: https://github.com/ACTRIS-Data-Centre/actris-jupyter-hub
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: feature/pynblint
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub git:
        commands:
        - /usr/bin/env sh .sqa/script.wiggy-green-lemur.sh
        container: qc.acc_flimsy-orchid-corgi
  QC.Doc:
    repos:
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.seedy-orchid-dollar.sh
        container: qc.doc_droopy-ochre-earwig
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub git:
        commands:
        - /usr/bin/env sh .sqa/script.frumpy-goldenrod-frigatebird.sh
        container: qc.doc_geeky-amethyst-husky
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.sleepy-rust-lionfish.sh
        container: qc.doc_muggy-black-dormouse
  QC.Lic:
    repos:
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub licensee:
        commands:
        - /usr/bin/env sh .sqa/script.flabby-coral-hound.sh
        container: qc.lic_gloppy-olive-dugong
  QC.Sec:
    repos:
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub bandit:
        commands:
        - /usr/bin/env sh .sqa/script.trippy-chartreuse-orangutan.sh
        container: qc.sec_scaly-celadon-woodpecker
  QC.Sty:
    repos:
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub flake8:
        commands:
        - /usr/bin/env sh .sqa/script.sloppy-copper-tiger.sh
        container: qc.sty_lousy-ultramarine-whale
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.flimsy-orchid-chamois.sh
        container: qc.sty_frumpy-sepia-wasp
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub pynblint.py:
        commands:
        - /usr/bin/env sh .sqa/script.slimy-orange-uguisu.sh
        container: qc.sty_craggy-cornflower-albatross
  QC.Uni:
    repos:
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub pytest:
        commands:
        - /usr/bin/env sh .sqa/script.breezy-taupe-spider.sh
        container: qc.uni_messy-heliotrope-flamingo
  QC.Ver:
    repos:
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.craggy-heliotrope-binturong.sh
        container: qc.ver_leaky-gold-peccary
timeout: 5400
