      github.com/ACTRIS-Data-Centre/actris-jupyter-hub flake8:
        commands:
        - /usr/bin/env sh .sqa/script.ultramarine_sweet_owl.sh
        container: qc.sty_plum_witty_python
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.cinnabar_mischievous_alpaca.sh
        container: qc.sty_verdant_shrewd_turtle
