      github.com/ACTRIS-Data-Centre/actris-jupyter-hub pytest:
        commands:
        - /usr/bin/env sh .sqa/script.linen_observant_orca.sh
        container: qc.uni_goldenrod_curious_donkey
  QC.Ver:
