config:
  credentials: []
  project_repos:
    github.com/ACTRIS-Data-Centre/actris-jupyter-hub:
      branch: main
      repo: https://github.com/ACTRIS-Data-Centre/actris-jupyter-hub
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: feature/pynblint_fix
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub git:
        commands:
        - /usr/bin/env sh .sqa/script.flamingo_clever_dingo.sh
        container: qc.acc_orange_vigilant_quokka
  QC.Doc:
    repos:
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.goldenrod_candid_finch.sh
        container: qc.doc_fog_assured_lobster
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub git:
        commands:
        - /usr/bin/env sh .sqa/script.hunter_bright_donkey.sh
        container: qc.doc_dusk_scrappy_phoenix
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.ice_blissful_grasshopper.sh
        container: qc.doc_coffee_persistent_dhole
  QC.Lic:
