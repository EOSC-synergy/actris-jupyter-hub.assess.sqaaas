    repos:
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub pytest:
        commands:
        - /usr/bin/env sh .sqa/script.goldenrod_stoic_wolverine.sh
        container: qc.uni_blush_realistic_salamander
  QC.Ver:
