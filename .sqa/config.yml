    repos:
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.fuchsia_decisive_seahorse.sh
        container: qc.ver_cyan_friendly_sparrow
timeout: 5400
