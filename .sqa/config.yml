      github.com/ACTRIS-Data-Centre/actris-jupyter-hub bandit:
        commands:
        - /usr/bin/env sh .sqa/script.frost_calm_leopard.sh
        container: qc.sec_pink_devoted_cassowary
  QC.Sty:
    repos:
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub flake8:
        commands:
        - /usr/bin/env sh .sqa/script.ginger_wondrous_toad.sh
        container: qc.sty_maroon_silly_coyote
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.raspberry_audacious_squid.sh
        container: qc.sty_forest_eccentric_boa
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub pynblint.py:
        commands:
        - /usr/bin/env sh .sqa/script.rosewater_confused_rabbit.sh
        container: qc.sty_ochre_scrappy_iguana
