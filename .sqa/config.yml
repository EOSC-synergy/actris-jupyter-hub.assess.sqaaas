      github.com/ACTRIS-Data-Centre/actris-jupyter-hub flake8:
        commands:
        - /usr/bin/env sh .sqa/script.arctic_imaginative_marmoset.sh
        container: qc.sty_persimmon_methodical_catfish
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.walnut_cranky_goose.sh
        container: qc.sty_rust_hardworking_angelfish
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub pynblint.py:
        commands:
        - /usr/bin/env sh .sqa/script.cerise_ambitious_komodo.sh
        container: qc.sty_purple_timid_buffalo
