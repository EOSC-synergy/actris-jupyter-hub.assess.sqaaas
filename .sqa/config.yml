      github.com/ACTRIS-Data-Centre/actris-jupyter-hub bandit:
        commands:
        - /usr/bin/env sh .sqa/script.khaki_generous_starfish.sh
        container: qc.sec_flint_humble_macaw
  QC.Sty:
