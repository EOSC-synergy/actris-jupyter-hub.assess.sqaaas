      github.com/ACTRIS-Data-Centre/actris-jupyter-hub get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.bluebell_carefree_gibbon.sh
        container: qc.ver_yellow_grateful_caribou
timeout: 5400
