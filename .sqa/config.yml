      github.com/ACTRIS-Data-Centre/actris-jupyter-hub flake8:
        commands:
        - /usr/bin/env sh .sqa/script.dawn_loving_groundhog.sh
        container: qc.sty_forest_cheerful_hawk
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.amaranth_savvy_spider.sh
        container: qc.sty_saffron_apathetic_llama
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub pynblint.py:
        commands:
        - /usr/bin/env sh .sqa/script.flamingo_passionate_eagle.sh
        container: qc.sty_royal_ardent_quokka
