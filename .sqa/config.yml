      github.com/ACTRIS-Data-Centre/actris-jupyter-hub bandit:
        commands:
        - /usr/bin/env sh .sqa/script.porcelain_thankful_albatross.sh
        container: qc.sec_horizon_tolerant_emu
  QC.Sty:
    repos:
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub flake8:
        commands:
        - /usr/bin/env sh .sqa/script.taupe_harmonious_boar.sh
        container: qc.sty_bone_carefree_lionfish
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.cinnabar_stubborn_fox.sh
        container: qc.sty_chili_observant_hedgehog
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub pynblint.py:
        commands:
        - /usr/bin/env sh .sqa/script.paprika_plucky_koala.sh
        container: qc.sty_ultramarine_audacious_grizzly
  QC.Uni:
