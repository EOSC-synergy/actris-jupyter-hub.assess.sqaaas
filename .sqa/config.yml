    repos:
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.denim_witty_hamster.sh
        container: qc.ver_sienna_peppy_giraffe
timeout: 5400
