      github.com/ACTRIS-Data-Centre/actris-jupyter-hub flake8:
        commands:
        - /usr/bin/env sh .sqa/script.pumpkin_affectionate_hawk.sh
        container: qc.sty_jade_funny_cormorant
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.horizon_tough_antelope.sh
