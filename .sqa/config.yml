        - /usr/bin/env sh .sqa/script.thistle_frugal_manatee.sh
        container: qc.acc_powder_eager_toad
  QC.Doc:
    repos:
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.pink_gracious_chameleon.sh
        container: qc.doc_champagne_unique_roadrunner
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub git:
        commands:
        - /usr/bin/env sh .sqa/script.lagoon_pensive_boar.sh
