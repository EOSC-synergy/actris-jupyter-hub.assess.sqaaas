config:
  credentials: []
  project_repos:
    github.com/ACTRIS-Data-Centre/actris-jupyter-hub:
      branch: main
      repo: https://github.com/ACTRIS-Data-Centre/actris-jupyter-hub
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: feature/pynblint_fix
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub git:
        commands:
        - /usr/bin/env sh .sqa/script.scaly-chartreuse-lionfish.sh
        container: qc.acc_frumpy-persimmon-goose
  QC.Doc:
    repos:
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.wimpy-periwinkle-hare.sh
        container: qc.doc_stuffy-bistre-saola
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub git:
        commands:
        - /usr/bin/env sh .sqa/script.nerdy-chocolate-hare.sh
        container: qc.doc_boozy-emerald-ostrich
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.squeaky-flax-bracke.sh
        container: qc.doc_snazzy-ultramarine-mouse
  QC.Lic:
    repos:
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub licensee:
        commands:
        - /usr/bin/env sh .sqa/script.slaphappy-eggplant-chimpanzee.sh
        container: qc.lic_crabby-heliotrope-leopard
  QC.Sec:
    repos:
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub bandit:
        commands:
        - /usr/bin/env sh .sqa/script.woolly-cerise-akita.sh
        container: qc.sec_jumpy-cardinal-dragon
  QC.Sty:
    repos:
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub flake8:
        commands:
        - /usr/bin/env sh .sqa/script.randy-cobalt-catfish.sh
        container: qc.sty_baggy-fuchsia-hyena
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.lovely-tomato-caracal.sh
        container: qc.sty_greasy-amaranth-beagle
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub pynblint.py:
        commands:
        - /usr/bin/env sh .sqa/script.leaky-brass-dragon.sh
        container: qc.sty_clammy-mauve-mau
  QC.Uni:
    repos:
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub pytest:
        commands:
        - /usr/bin/env sh .sqa/script.randy-azure-goose.sh
        container: qc.uni_fuzzy-ultramarine-cow
  QC.Ver:
    repos:
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.pretty-goldenrod-woodpecker.sh
        container: qc.ver_greasy-orchid-lemming
timeout: 5400
