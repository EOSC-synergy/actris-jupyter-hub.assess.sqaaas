      github.com/ACTRIS-Data-Centre/actris-jupyter-hub get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.brown_assured_frog.sh
        container: qc.ver_pearl_studious_grizzly
timeout: 5400
