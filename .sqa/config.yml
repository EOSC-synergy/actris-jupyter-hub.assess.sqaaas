config:
  credentials: []
  project_repos:
    github.com/ACTRIS-Data-Centre/actris-jupyter-hub:
      branch: main
      repo: https://github.com/ACTRIS-Data-Centre/actris-jupyter-hub
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: feature/pynblint_fix
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub git:
        commands:
        - /usr/bin/env sh .sqa/script.slaphappy-eggplant-lynx.sh
        container: qc.acc_gloppy-cinnamon-slug
  QC.Doc:
    repos:
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.foggy-crimson-eleuth.sh
        container: qc.doc_craggy-malachite-whale
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub git:
        commands:
        - /usr/bin/env sh .sqa/script.scummy-ultramarine-dalmatian.sh
        container: qc.doc_zippy-chartreuse-barracuda
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.snippy-firebrick-mongrel.sh
        container: qc.doc_freaky-asparagus-angora
  QC.Lic:
    repos:
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub licensee:
        commands:
        - /usr/bin/env sh .sqa/script.flaky-sepia-camel.sh
        container: qc.lic_hilly-orange-olm
  QC.Sec:
    repos:
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub bandit:
        commands:
        - /usr/bin/env sh .sqa/script.gummy-ecru-fish.sh
        container: qc.sec_lanky-violet-capybara
  QC.Sty:
    repos:
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub flake8:
        commands:
        - /usr/bin/env sh .sqa/script.lumpy-indigo-bandicoot.sh
        container: qc.sty_paltry-chestnut-hyena
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.scanty-ivory-chinchilla.sh
        container: qc.sty_fuzzy-zucchini-cuscus
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub pynblint.py:
        commands:
        - /usr/bin/env sh .sqa/script.pretty-cornflower-bandicoot.sh
        container: qc.sty_geeky-lemon-husky
  QC.Uni:
    repos:
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub pytest:
        commands:
        - /usr/bin/env sh .sqa/script.shabby-magnolia-fowl.sh
        container: qc.uni_chummy-amaranth-catfish
  QC.Ver:
    repos:
      github.com/ACTRIS-Data-Centre/actris-jupyter-hub get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.sunny-copper-wildebeest.sh
        container: qc.ver_breezy-amaranth-tang
timeout: 5400
